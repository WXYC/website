# Builds the Next.js static export and deploys it to Cloudflare Workers.
#
# wxyc.org is served by the assets-only Worker `wxyc-website-production`,
# which claims the `wxyc.org/*` route declared in wrangler.jsonc's
# env.production. GitHub Pages was retired in WXYC/website#262.
name: Deploy to Cloudflare

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Workflow-level GITHUB_TOKEN scope. Nothing here deploys via GITHUB_TOKEN
# any more — the Cloudflare deploy authenticates with its own repo secret —
# so contents:read is the floor. Re-adding pages:write would only re-arm the
# retired pipeline.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'cloudflare'
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Build TinaCMS
        env:
          TINA_PUBLIC_CLIENT_ID: ${{ secrets.TINA_PUBLIC_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          SEARCH_TOKEN: ${{ secrets.SEARCH_TOKEN }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
        run: npx tinacms build
      - name: Build with Next.js
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
      - name: Generate sitemap
        # Order is load-bearing: after next build (it enumerates the built
        # pages) and before the tar, which is what the deploy job uploads.
        run: python3 scripts/generate-sitemap.py
      - name: Pack Cloudflare assets artifact
        # upload-artifact validates every filename and rejects the : " < > |
        # * ? punctuation that exists under public/uploads (36 files), so
        # hand it a single tar instead. The tar also carries
        # out/.assetsignore, which must survive the hand-off or the Workers
        # deploy fails on the file it exists to exclude.
        run: tar -cf "$RUNNER_TEMP/cloudflare-assets.tar" -C out .
      - name: Upload Cloudflare assets artifact
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-assets
          path: ${{ runner.temp }}/cloudflare-assets.tar
          # Already-compressed media; gzip only burns CPU.
          compression-level: 0
          retention-days: 1

  # Cloudflare Workers PRODUCTION deploy (WXYC/website#262): claims the
  # wxyc.org/* route declared in wrangler.jsonc's env.production. This is now
  # the only deploy path — the GitHub Pages job it used to run beside was
  # retired with the rest of that pipeline. Kept as its own job so the deploy
  # stays separable from the build. Step order matters — checkout runs
  # `git clean`, which would wipe a previously downloaded out/ (it is
  # gitignored).
  deploy-cloudflare:
    runs-on: ubuntu-latest
    needs: build
    # workflow_dispatch can fire from any ref; never deploy a branch.
    if: github.ref == 'refs/heads/main'
    # Job-scoped floor, restated rather than inherited: the job holding the
    # Cloudflare token should carry no GITHUB_TOKEN write of any kind.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: cloudflare-assets
          path: ${{ runner.temp }}
      - name: Unpack built site
        run: mkdir -p out && tar -xf "$RUNNER_TEMP/cloudflare-assets.tar" -C out
      - name: Guard asset sizes
        # TinaCMS Cloud commits editor uploads straight to main with no PR,
        # so this is the only run that can catch an oversized upload before
        # it fails the deploy. Guard file only — the full jsdom suite must
        # not gate a content publish.
        run: npx --no-install vitest run __tests__/asset-size-guard.test.js
        env:
          ASSET_GUARD_ROOT: out
      - name: Deploy to Cloudflare Workers
        run: npm run deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
